<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Trail Finder</h1>
        <p class="intro">Find a hiking trail and save the ones you want to try.</p>

        <h2>Explore Trails</h2>
        <div id="trailList" class="trail-grid"></div>

        <section class="saved-section">
            <h2>Saved Trails</h2>
            <p id="savedCount">Saved: 0</p>
            <div id="savedList" class="trail-grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
